# Serves the built UI and forwards API paths to the backend on the Compose
# network, so the browser only ever talks to one origin (no CORS needed).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve `api` per request through Docker's DNS. A fixed upstream would be
    # resolved once at startup and go stale when the API container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    location ~ ^/(api|admin|health|supplierA|supplierB)(/|$) {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A search can legitimately run up to the API's 60 s workflow timeout;
        # nginx must not give up first and replace its JSON error with HTML.
        proxy_read_timeout 90s;
    }

    # Build assets are content-hashed, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
